services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "5173:5173"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgres://phonemail:${POSTGRES_PASSWORD:-phonemail-local}@db:5432/phonemail
      JWT_SECRET: ${JWT_SECRET:-replace-this-before-deploying}
      EMAIL_DOMAIN: ${EMAIL_DOMAIN:-phonemail.com}
      AUTH_MODE: ${AUTH_MODE:-otp}
      OTP_PROVIDER: ${OTP_PROVIDER:-local}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      APP_URL: ${APP_URL:-}
      INBOUND_WEBHOOK_SECRET: ${INBOUND_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "if [ \"$$NODE_ENV\" = \"production\" ]; then npm start; else npm run dev; fi"]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: phonemail
      POSTGRES_USER: phonemail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phonemail-local}
    volumes:
      - phonemail-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phonemail -d phonemail"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  phonemail-data:
